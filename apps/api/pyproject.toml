[project]
name = "vistaro"
version = "0.1.0"
description = "Vistaro API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "celery>=5.4",
    "cryptography>=43",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sentry-sdk>=2.19",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "import-linter>=2.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vistaro"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_packages = ["vistaro"]

[[tool.importlinter.contracts]]
name = "core must not import the app entry point"
type = "forbidden"
source_modules = ["vistaro.core"]
forbidden_modules = ["vistaro.main"]
