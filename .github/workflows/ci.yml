
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Exports OpenAPI without needing a running database.
  export-openapi:
    name: Export OpenAPI spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit Python dependencies
        run: uv audit --locked

      - name: Export OpenAPI specification
        run: uv run python scripts/export_openapi.py

      - name: Verify OpenAPI export is unchanged
        run: |
          if ! git diff --exit-code openapi.json; then
            echo "ERROR: openapi.json is out of date. Run 'uv run python scripts/export_openapi.py' and commit the result."
            exit 1
          fi

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: apps/api/openapi.json
          retention-days: 1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Local-only CI credentials; not production secrets.
    env:
      DATABASE_URL: postgresql://vistaro_app:vistaro_app_local_only@localhost:5432/vistaro
      MIGRATOR_DATABASE_URL: postgresql://vistaro_migrator:vistaro_migrator_local_only@localhost:5432/vistaro
      VISTARO_ADMIN_DATABASE_URL: postgresql://vistaro:vistaro_local_only@localhost:5432/vistaro
      REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vistaro
          POSTGRES_USER: vistaro
          POSTGRES_PASSWORD: vistaro_local_only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U vistaro -d vistaro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Bootstrap database roles (DB-001)
        run: |
          cat ../../infra/initdb/01_roles_and_extensions.sql |
            docker exec -i ${{ job.services.postgres.id }} psql -U vistaro -d vistaro

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Check module boundaries
        run: uv run lint-imports

      - name: Test
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: export-openapi
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Download OpenAPI artifact
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: apps/api

      - name: Check TypeScript client drift
        run: pnpm codegen:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown
