name: vistaro

# Local development only. INFRA-001 pins exact image tags/digests and verifies
# the compose file with Docker; Docker was not available during REPO-001.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vistaro
      POSTGRES_USER: vistaro
      POSTGRES_PASSWORD: vistaro_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vistaro -d vistaro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
